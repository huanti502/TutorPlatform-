<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mất kết nối - Gia Sư Việt</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center;
               min-height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; text-align: center; }
        .box { max-width: 360px; padding: 24px; }
        .emoji { font-size: 4rem; }
        h2 { margin: .5rem 0; }
        p { color: #64748b; }
        button { background: #7c3aed; color: #fff; border: none; border-radius: 10px;
                 padding: 12px 28px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">📡</div>
        <h2>Mất kết nối mạng</h2>
        <p>Không thể kết nối tới Gia Sư Việt. Hãy kiểm tra mạng rồi thử lại.</p>
        <button onclick="location.reload()">Thử lại</button>
    </div>
</body>
</html>
